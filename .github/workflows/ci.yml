name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci

      - name: build
        run: ASSET_PATH="/themes/custom/middlebury_theme/js/" npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Test
        run: npm run test
        env:
          BUNDLESIZE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Percy Test
      #   if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
      #   run: 'npm run test:visual'
      #   env:
      #     PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Replace images
        if: github.ref == 'refs/heads/master'
        run: gulp replaceImagePaths --imagesDir="https://www.middlebury.edu/themes/custom/middlebury_theme/images/"

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          publish_branch: master-dist
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Tag the master-dist commit built from this push with the version in
  # package.json. Releases are only ever tagged here, never by hand.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Tag master-dist
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$VERSION' is not X.Y.Z"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::notice::$VERSION is already tagged; bump the version in package.json to release"
            exit 0
          fi

          # peaceiris/actions-gh-pages commits as "deploy: <source sha>"
          DIST_SHA=$(git log origin/master-dist -n 1 --format=%H --grep="^deploy: $GITHUB_SHA$")
          if [ -z "$DIST_SHA" ]; then
            echo "::error::No master-dist commit found for $GITHUB_SHA"
            exit 1
          fi
          if ! git cat-file -e "$DIST_SHA:composer.json"; then
            echo "::error::master-dist commit $DIST_SHA has no composer.json"
            exit 1
          fi

          git tag "$VERSION" "$DIST_SHA"
          git push origin "refs/tags/$VERSION"
          echo "::notice::Tagged $VERSION on master-dist $DIST_SHA"

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'master'
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: Frontend build
          fields: repo,commit,message,author
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
